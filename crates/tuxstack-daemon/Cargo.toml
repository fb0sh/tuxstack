thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tuxstack-docker-core = { path = "../docker-core" }
tuxstack-domain.workspace = true
tuxstack-protocol = { path = "../tuxstack-protocol" }
tuxstack-vfs = { path = "../tuxstack-vfs" }
