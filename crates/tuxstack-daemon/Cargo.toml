[package]
name = "tuxstack-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "TuxStack per-user Docker daemon, typed IPC server, and FUSE owner"
publish = false

[[bin]]
name = "tuxstackd"
