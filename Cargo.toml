[workspace]
resolver = "2"
members = [
    "crates/docker-core",
    "crates/gui",
    "crates/tuxstack-cli",
    "crates/tuxstack-client",
    "crates/tuxstack-daemon",
    "crates/tuxstack-domain",
    "crates/tuxstack-fs-helper",
    "crates/tuxstack-fs-protocol",
    "crates/tuxstack-protocol",
    "crates/tuxstack-vfs",
]
default-members = ["crates/gui"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bollard = "0.21"
bytes = "1"
ciborium = "0.2"
chrono = { version = "0.4", features = ["serde"] }
fuser = { version = "=0.18.0", default-features = false }
futures-util = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
slab = "0.4"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tuxstack-domain = { path = "crates/tuxstack-domain" }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
# Optimize the shipped GUI binary for footprint. Fat LTO and one codegen
# unit give LLVM visibility across crate boundaries, while aborting on panic
# removes unwinding paths that cannot provide a useful recovery inside the
# Qt event loop.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
